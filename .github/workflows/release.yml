name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BIN: tokei

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: tokei-x86_64-pc-windows-msvc.exe
            archive: none
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: tokei-x86_64-unknown-linux-gnu.tar.gz
            archive: tar
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: tokei-aarch64-apple-darwin.tar.gz
            archive: tar
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: tar -czvf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release ${{ env.BIN }}

      - name: Rename Windows binary
        if: matrix.archive == 'none'
        run: cp target/${{ matrix.target }}/release/${{ env.BIN }}.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find assets -type f -exec cp {} upload/ \;
          ls -la upload/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: upload/*
